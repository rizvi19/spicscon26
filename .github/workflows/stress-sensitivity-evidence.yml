name: Stress sensitivity evidence
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stress-sensitivity-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/research-evidence-upgrades
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run smoke stress sensitivity analysis
        run: python -m src.stress_sensitivity_experiments --config configs/expanded_seeds.yaml --mode smoke
      - name: Run final ten-seed stress sensitivity analysis
        run: python -m src.stress_sensitivity_experiments --config configs/expanded_seeds.yaml --mode final
      - name: Upload stress sensitivity evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-sensitivity-evidence-${{ github.run_id }}
          path: |
            results/stress_sensitivity_20260602/
            paper/tables/stress_sensitivity_20260602/
      - name: Commit generated evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/stress_sensitivity_20260602 paper/tables/stress_sensitivity_20260602
          if ! git diff --cached --quiet; then
            git commit -m "Record stress sensitivity evidence workflow outputs"
            git push origin HEAD:codex/research-evidence-upgrades
          fi
