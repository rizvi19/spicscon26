name: Tracking baseline evidence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tracking-baseline-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v4
        with:
          ref: codex/research-evidence-upgrades
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run smoke tracking baseline
        run: python -m src.tracking_baseline_experiments --config configs/expanded_seeds.yaml --mode smoke

      - name: Run final ten-seed tracking baseline
        run: python -m src.tracking_baseline_experiments --config configs/expanded_seeds.yaml --mode final

      - name: Upload tracking evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracking-baseline-evidence-${{ github.run_id }}
          path: |
            results/tracking_baseline_20260602/
            paper/tables/tracking_baseline_20260602/

      - name: Commit generated evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/tracking_baseline_20260602 paper/tables/tracking_baseline_20260602
          if ! git diff --cached --quiet; then
            git commit -m "Record tracking baseline evidence workflow outputs"
            git push origin HEAD:codex/research-evidence-upgrades
          fi
